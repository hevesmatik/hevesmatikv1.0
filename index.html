<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hevesmatik</title>
<meta name="description" content="Hevesmatik: 3D baskı figürler, kamyon modelleri ve RC araçlar. Instagram, Shopier veya WhatsApp üzerinden bize ulaşın.">
<meta name="theme-color" content="#CFE8F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --baby:#CFE8F7;
  --baby-l:#E8F4FB;
  --baby-d:#A9D3EC;
  --brown:#6B4A32;
  --brown-l:#8A6446;
  --brown-d:#4A3222;
  --skin:#FFF4E3;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  min-height:100%;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--brown-d);
  background:linear-gradient(180deg,var(--baby-l) 0%,var(--baby) 55%,var(--baby-d) 100%) fixed;
  -webkit-font-smoothing:antialiased;
  display:grid;place-items:center;
  overflow-x:hidden;
  padding:max(20px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
}

/* Arka planda sürekli yükselen ikonlar */
.bgicons{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ic{
  position:absolute;bottom:-100px;left:var(--l);
  width:var(--s);height:var(--s);
  color:var(--brown);opacity:.2;
  animation:rise var(--d) linear infinite;animation-delay:var(--dl);
  will-change:transform;
}
.ic.w{color:#fff;opacity:.7}
.ic svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@keyframes rise{
  from{transform:translate3d(0,0,0) rotate(0)}
  to{transform:translate3d(var(--dx),calc(-100vh - 200px),0) rotate(var(--rot))}
}

.wrap{position:relative;z-index:1;width:100%;max-width:420px;text-align:center}

/* Karşılama karakteri */
.stage{
  display:flex;flex-direction:column;align-items:center;
  animation:enter 1s var(--ease) both;
}
@keyframes enter{
  0%{opacity:0;transform:translateY(-80px) scale(.9)}
  55%{opacity:1;transform:translateY(10px)}
  78%{transform:translateY(-5px)}
  100%{opacity:1;transform:none}
}
.bubble{
  position:relative;
  background:#fff;border:2px solid var(--brown);
  color:var(--brown-d);font-weight:600;font-size:14.5px;line-height:1.35;
  padding:10px 16px;margin-bottom:14px;max-width:290px;min-height:44px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
}
.bubble::after{
  content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;
  margin-left:-6px;background:#fff;
  border-right:2px solid var(--brown);border-bottom:2px solid var(--brown);
  transform:rotate(45deg);
}
.bubble.in{animation:pop .45s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.88)}to{opacity:1;transform:none}}

.jumper{
  background:none;border:0;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.jumper:focus-visible{outline:3px solid var(--brown-d);outline-offset:4px}
.jumper.jump{animation:jump .55s var(--ease)}
@keyframes jump{
  0%{transform:none}
  35%{transform:translateY(-28px)}
  65%{transform:translateY(0) scaleY(.94)}
  100%{transform:none}
}
.char{display:block;width:clamp(120px,34vw,150px);height:auto;overflow:visible;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.pupil{transition:transform .15s ease-out}
.arm-r{transform-origin:110px 124px;animation:wave 3.6s ease-in-out infinite}
@keyframes wave{
  0%{transform:rotate(0)}
  10%{transform:rotate(16deg)}
  20%{transform:rotate(-10deg)}
  30%{transform:rotate(16deg)}
  40%{transform:rotate(-10deg)}
  50%{transform:rotate(12deg)}
  60%,100%{transform:rotate(0)}
}

h1{
  font-family:"Space Grotesk",sans-serif;font-weight:700;
  font-size:clamp(30px,8vw,42px);letter-spacing:.14em;text-transform:uppercase;
  color:var(--brown-d);margin-top:14px;
}
.sub{margin:8px 0 26px;font-size:14.5px;font-weight:500;color:var(--brown)}

.links{display:grid;gap:12px}
.btn{
  display:flex;align-items:center;gap:14px;
  min-height:64px;padding:12px 20px;
  text-decoration:none;text-align:left;
  font-weight:600;font-size:16px;
  border:2px solid var(--brown);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .25s,color .25s;
  -webkit-tap-highlight-color:transparent;
}
.btn svg{flex:0 0 auto;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn span{display:block;line-height:1.25}
.btn small{display:block;font-size:12.5px;font-weight:500;opacity:.8;margin-top:2px}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(74,50,34,.22)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:3px solid var(--brown-d);outline-offset:3px}
.primary{background:var(--brown);color:#FBF3EA;min-height:76px;font-size:17px}
.primary:hover{background:var(--brown-d)}
.ghost{background:rgba(255,255,255,.8);color:var(--brown-d)}
.ghost:hover{background:var(--brown);color:#FBF3EA}

@media(max-height:700px){
  .char{width:104px}
  .bubble{margin-bottom:10px;min-height:40px}
  h1{margin-top:8px}
  .sub{margin-bottom:18px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .bubble{opacity:1}
  .bgicons{display:none}
}
</style>
</head>
<body>
<div class="bgicons" id="bg" aria-hidden="true"></div>

<main class="wrap">
  <div class="stage">
    <div class="bubble" id="bubble" aria-hidden="true"><span id="bubbleTxt">Merhaba, hoş geldin!</span></div>
    <button class="jumper" id="mascot" type="button" aria-label="Hevesmatik karakteri">
      <svg class="char" viewBox="0 0 160 170" aria-hidden="true">
        <ellipse cx="80" cy="164" rx="34" ry="4" fill="rgba(74,50,34,.16)"/>
        <!-- sol kol -->
        <path d="M50 126 L36 148" stroke="#4A3222" stroke-width="13" stroke-linecap="round"/>
        <path d="M50 126 L36 148" stroke="#A9D3EC" stroke-width="7" stroke-linecap="round"/>
        <circle cx="35" cy="150" r="6.5" fill="#FFF4E3" stroke="#4A3222" stroke-width="2.5"/>
        <!-- gövde -->
        <path d="M48 162 V130 Q48 112 66 112 H94 Q112 112 112 130 V162 Z" fill="#A9D3EC" stroke="#4A3222" stroke-width="3" stroke-linejoin="round"/>
        <path d="M80 112 V162" stroke="#4A3222" stroke-width="2" opacity=".35"/>
        <!-- sağ kol (el sallıyor) -->
        <g class="arm-r">
          <path d="M110 124 L136 96" stroke="#4A3222" stroke-width="13" stroke-linecap="round"/>
          <path d="M110 124 L136 96" stroke="#A9D3EC" stroke-width="7" stroke-linecap="round"/>
          <circle cx="139" cy="92" r="7.5" fill="#FFF4E3" stroke="#4A3222" stroke-width="2.5"/>
        </g>
        <!-- kafa -->
        <circle cx="80" cy="76" r="42" fill="#FFF4E3" stroke="#4A3222" stroke-width="3"/>
        <!-- şapka -->
        <path d="M38 72 Q40 30 80 30 Q120 30 122 72 Q104 58 80 58 Q56 58 38 72 Z" fill="#6B4A32" stroke="#4A3222" stroke-width="3" stroke-linejoin="round"/>
        <path d="M32 72 Q80 52 128 72 Q80 64 32 72 Z" fill="#8A6446" stroke="#4A3222" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="80" cy="27" r="5.5" fill="#A9D3EC" stroke="#4A3222" stroke-width="2.5"/>
        <!-- gözler -->
        <g class="eyes">
          <ellipse cx="65" cy="82" rx="7" ry="8" fill="#fff" stroke="#4A3222" stroke-width="2"/>
          <ellipse cx="95" cy="82" rx="7" ry="8" fill="#fff" stroke="#4A3222" stroke-width="2"/>
          <circle class="pupil" cx="65" cy="82" r="3.4" fill="#4A3222"/>
          <circle class="pupil" cx="95" cy="82" r="3.4" fill="#4A3222"/>
        </g>
        <ellipse cx="50" cy="94" rx="6" ry="3.6" fill="#F4B6A6" opacity=".7"/>
        <ellipse cx="110" cy="94" rx="6" ry="3.6" fill="#F4B6A6" opacity=".7"/>
        <path d="M68 98 Q80 110 92 98" fill="none" stroke="#4A3222" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <h1>Hevesmatik</h1>
  <p class="sub">3D figür, kamyon modeli ve RC araç</p>

  <nav class="links">
    <a class="btn primary" href="https://www.instagram.com/hevesmatik/" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".9" fill="currentColor" stroke="none"/></svg>
      <span>Instagram<small>@hevesmatik</small></span>
    </a>
    <a class="btn ghost" href="https://www.shopier.com/hevesmatik" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Shopier mağazası<small>Kart ve taksitle ödeme</small></span>
    </a>
    <a class="btn ghost" id="wa" href="#" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>
      <span>WhatsApp ile sipariş<small>0538 608 21 55</small></span>
    </a>
  </nav>
</main>

<script>
(function(){
  /* WhatsApp: telefonda uygulama, bilgisayarda WhatsApp Web */
  var n="905386082155",q=encodeURIComponent("Merhaba, Hevesmatik'ten sipariş vermek istiyorum.");
  var mob=/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
  var wa=document.getElementById("wa");
  wa.href=mob?"https://wa.me/"+n+"?text="+q:"https://web.whatsapp.com/send?phone="+n+"&text="+q;
  wa.target="_blank";

  /* Arka plan ikonları: 3B figür, kamyon, RC araç, hediye, robot, kumanda, yıldız */
  var ICONS=[
    '<path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>',
    '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62L18.3 8.4a1 1 0 0 0-.78-.4H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
    '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
    '<rect x="3" y="8" width="18" height="4"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>',
    '<rect x="4" y="8" width="16" height="12"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1"/><circle cx="9" cy="14" r="1.2"/><circle cx="15" cy="14" r="1.2"/><path d="M9 18h6"/>',
    '<path d="M6 12h4"/><path d="M8 10v4"/><circle cx="15" cy="13" r="1"/><circle cx="18" cy="11" r="1"/><rect x="2" y="6" width="20" height="12" rx="4"/>',
    '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/>'
  ];
  var bg=document.getElementById("bg"),
      count=window.innerWidth<640?13:22;
  for(var i=0;i<count;i++){
    var d=document.createElement("div"),
        dur=22+Math.random()*26;
    d.className="ic"+(i%3===0?" w":"");
    d.style.setProperty("--l",((i+Math.random()*.8)/count*100).toFixed(1)+"%");
    d.style.setProperty("--s",(26+Math.random()*34).toFixed(0)+"px");
    d.style.setProperty("--d",dur.toFixed(1)+"s");
    d.style.setProperty("--dl",(-Math.random()*dur).toFixed(1)+"s");
    d.style.setProperty("--dx",(Math.random()*160-80).toFixed(0)+"px");
    d.style.setProperty("--rot",(Math.random()*360-180).toFixed(0)+"deg");
    d.innerHTML='<svg viewBox="0 0 24 24">'+ICONS[i%ICONS.length]+'</svg>';
    bg.appendChild(d);
  }

  /* Karakter: gözler imleci/dokunuşu takip eder */
  var mascot=document.getElementById("mascot"),
      pupils=document.querySelectorAll(".pupil");
  function look(x,y){
    var r=mascot.getBoundingClientRect(),
        cx=r.left+r.width/2,cy=r.top+r.height*.48,
        dx=x-cx,dy=y-cy,dist=Math.hypot(dx,dy)||1,k=Math.min(1,dist/220);
    pupils.forEach(function(p){
      p.style.transform="translate("+(dx/dist*3.4*k).toFixed(2)+"px,"+(dy/dist*3.4*k).toFixed(2)+"px)";
    });
  }
  addEventListener("pointermove",function(e){look(e.clientX,e.clientY)});
  addEventListener("pointerdown",function(e){look(e.clientX,e.clientY)});

  /* Konuşma balonu */
  var bubble=document.getElementById("bubble"),
      txt=document.getElementById("bubbleTxt"),
      msgs=["Merhaba, hoş geldin!","Sipariş için bir butona dokunman yeter","Bana dokunursan zıplarım"],
      idx=0,timer;
  function say(t){
    bubble.classList.remove("in");void bubble.offsetWidth;
    txt.textContent=t;bubble.classList.add("in");
  }
  function cycle(){
    clearInterval(timer);
    timer=setInterval(function(){idx=(idx+1)%msgs.length;say(msgs[idx])},4200);
  }
  setTimeout(function(){say(msgs[0]);cycle()},800);

  mascot.addEventListener("click",function(){
    mascot.classList.remove("jump");void mascot.offsetWidth;mascot.classList.add("jump");
    say("Hehe, gıdıklandım!");cycle();
  });
})();
</script>
</body>
</html>
