<style>

label{display:block;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;background:#0A1624;border:1px solid var(--line);color:var(--ink)}

details.box summary{cursor:pointer;list-style:none}small{color:var(--soft)}
.lg{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 15% 0,rgba(99,102,241,.3),transparent),radial-gradient(800px 500px at 95% 100%,rgba(56,189,248,.24),transparent),var(--bg)}
.lgc{width:min(400px,92vw);background:rgba(16,30,46,.88);border:1px solid var(--line);padding:32px;box-shadow:0 0 70px rgba(99,102,241,.28);backdrop-filter:blur(10px)}
.kp{position:relative;overflow:hidden}.kp:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--g);box-shadow:0 0 14px var(--g)}
.dk{background:radial-gradient(1100px 480px at 15% -10%,#18354f 0,#0B1622 62%);color:#DCEEF7;padding:22px;border:1px solid rgba(165,211,232,.18);box-shadow:0 0 60px rgba(74,135,168,.22) inset}
.dk h4{font-family:"Space Grotesk",sans-serif;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#A5D3E8;margin-bottom:12px;font-weight:500}
.kps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.kp{background:rgba(255,255,255,.03);border:1px solid color-mix(in srgb,var(--g) 45%,transparent);padding:16px;box-shadow:0 0 22px color-mix(in srgb,var(--g) 25%,transparent)}
.kp .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8fb0c6}.kp .v{font-size:30px;font-weight:700;font-family:"Space Grotesk",sans-serif;color:#fff;text-shadow:0 0 16px var(--g);margin:4px 0}.kp .s{font-size:12px;color:#8fb0c6}
.pn{background:rgba(255,255,255,.03);border:1px solid rgba(165,211,232,.18);padding:18px;margin-top:16px;box-shadow:0 0 28px rgba(74,135,168,.14)}
.live{display:inline-block;width:10px;height:10px;background:#3DFFA2;border-radius:50%!important;animation:pl 1.6s infinite;margin-right:8px}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(61,255,162,.8)}100%{box-shadow:0 0 0 14px rgba(61,255,162,0)}}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.dg{grid-template-columns:1fr}}
.tl{position:relative;display:flex;justify-content:space-between;padding:7px 8px;font-size:13px;margin-bottom:4px;overflow:hidden}.tl i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(165,211,232,.32),transparent)}.tl span,.tl b{position:relative}
.lv{display:grid;grid-template-columns:1.5fr 1.2fr .7fr .6fr;gap:8px;font-size:13px;padding:8px 4px;border-bottom:1px solid rgba(165,211,232,.1)}
.fd{display:flex;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(165,211,232,.08)}.fd i{width:8px;height:8px;margin-top:6px;flex:none}.fd small{color:#8fb0c6;margin-left:auto;white-space:nowrap}

.dk{background:none;border:0;box-shadow:none;padding:0}
</style></head><body>
<div id="app"></div><div hidden><a id="logo"></a><a id="bC"></a><button id="bU"></button><form id="fS"><input id="q"></form><div id="nav"></div><b id="ftN"></b><a id="ftIg"></a><div id="ck"><button id="ckOk"></button></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const CFG={firebase:{apiKey:"AIzaSyBUTqw9eCeF82nkPDHKRSiV6B0cSezmMJ4",authDomain:"hevesmatik-90d0a.firebaseapp.com",projectId:"hevesmatik-90d0a",storageBucket:"hevesmatik-90d0a.firebasestorage.app",messagingSenderId:"733456385060",appId:"1:733456385060:web:8dcc57312b3c3ea10604b1"},

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],app=$("#app");

const app0=initializeApp(CFG.firebase),auth=getAuth(app0),db=getFirestore(app0);
let user=null,prof={},P=[],CATS=[],SLIDES=[],CONF={},AT="dash",ED=null,PT="bilgi";
const DEF=[["figur","3D Figürler","🗿"],["kamyon","Kamyon & İş Makinesi","🚚"],["rc","RC Araçlar","🏎️"],["oyuncak","Oyuncaklar","🧸"],["hediye","Hediyelik","🎁"]];
const LSg=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},LSs=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

const prod=id=>P.find(x=>x.id===id),catName=id=>(CATS.find(c=>c.id===id)||{ad:id}).ad,C=k=>CONF[k]||CFG[k];

const totals=()=>{const sub=cart.reduce((a,c)=>{const p=prod(c.id);return a+(p?p.fiyat*c.q:0)},0),ind=Math.round(sub*CFG.havale*100)/100,k=sub>=CFG.ucretsiz||!sub?0:CFG.kargo;return{sub,ind,k,top:sub-ind+k}};

const ICONS={chart:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',image:'<rect width="18" height="18" x="3" y="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/>',grid:'<rect width="7" height="7" x="3" y="3"/><rect width="7" height="7" x="14" y="3"/><rect width="7" height="7" x="14" y="14"/><rect width="7" height="7" x="3" y="14"/>',box:'<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',mail:'<rect width="20" height="16" x="2" y="4"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>'};
const ic=(n,z=20)=>`<svg class="sv" width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const errTxt=x=>x&&x.code==="permission-denied"?"Yetki hatası: Firestore kuralları yazmaya izin vermiyor. firestore.rules dosyasını Firebase Konsolu → Firestore → Kurallar bölümüne yapıştırıp Yayınla deyin ve yönetici hesabıyla giriş yaptığınızdan emin olun.":x&&x.code==="invalid-argument"?"Veri kabul edilmedi (görsel çok büyük olabilir): "+x.message:(x&&(x.message||x.code))||String(x);
const img2url=(f,max=1000,kb=420)=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error("Dosya okunamadı."));r.onload=()=>{const i=new Image();i.onerror=()=>rej(new Error("Görsel açılamadı. JPG veya PNG yükleyin (HEIC desteklenmez)."));i.onload=()=>{let s=Math.min(1,max/Math.max(i.width,i.height)),q=.86,u;const c=document.createElement("canvas");for(let n=0;n<8;n++){c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);u=c.toDataURL("image/jpeg",q);if(u.length<kb*1365)break;q=Math.max(.5,q-.1);s*=.85}if(u.length>900000)return rej(new Error("Görsel çok büyük, daha küçük bir dosya seçin."));res(u)};i.src=r.result};r.readAsDataURL(f)});

<div class="tx"><a class="nm" href="#/urun/${p.id}">${esc(p.ad)}</a><div class="pr">${TL(p.fiyat)}${p.eski>p.fiyat?`<s>${TL(p.eski)}</s>`:""}</div><div class="stok ${p.stok>0?"":"y"}">${p.stok>0?"● Stokta":"● Tükendi"}</div>

return`<div class="w"><p style="margin:16px 0"><a href="#/kategori/${p.cat}">← ${esc(catName(p.cat))}</a></p><div class="pd"><div class="pdi">${p.img?`<img src="${esc(p.img)}" alt="">`:"📦"}</div>
<div><h2 style="margin-top:0">${esc(p.ad)}</h2><div class="pr" style="font-size:32px">${TL(p.fiyat)}${p.eski>p.fiyat?`<s>${TL(p.eski)}</s>`:""}</div><p style="margin:12px 0;color:var(--soft)">${esc(p.aciklama||"")}</p>
<p><span class="badge g">Havale/EFT ile ${TL(h)}</span> <span class="badge ${p.stok>0?"":"r"}">${p.stok>0?p.stok+" adet stokta":"Stok yok"}</span></p><br>
<button class="add" style="padding:15px;font-size:16px" data-add="${p.id}" ${p.stok>0?"":"disabled"}>Sepete Ekle</button></div></div></div>`};
V.cart=()=>{if(!cart.length)return`<div class="w"><h2>Sepetim</h2>${empty("Sepetiniz boş")}</div>`;const t=totals();
return`<div class="w"><h2>Sepetim</h2><div class="box"><table>${cart.map(c=>{const p=prod(c.id);return p?`<tr><td><b>${esc(p.ad)}</b><br><small>${TL(p.fiyat)}</small></td><td><div class="qty"><button data-q="${c.id}" data-d="-1">−</button><span>${c.q}</span><button data-q="${c.id}" data-d="1">+</button></div></td><td><b>${TL(p.fiyat*c.q)}</b></td><td><button class="btn s" data-rm="${c.id}">✕</button></td></tr>`:""}).join("")}</table>
<div style="max-width:320px;margin:18px 0 0 auto"><p>Ara toplam: <b>${TL(t.sub)}</b></p><p style="color:var(--ok)">Havale indirimi: −${TL(t.ind)}</p><p>Kargo: ${t.k?TL(t.k):"Ücretsiz"}</p><h3>Toplam (havale): ${TL(t.top)}</h3></div>
<p style="text-align:right;margin-top:14px"><a class="btn p" href="#/odeme">Ödemeye Geç →</a></p></div></div>`};
V.pay=()=>{if(!cart.length)return V.cart();const t=totals(),u=user,f=prof;
return`<div class="w"><h2>Ödeme</h2><div class="two"><form class="box" onsubmit="return false"><h3>Teslimat bilgileri</h3>
<label>Ad Soyad *</label><input id="o1" value="${esc(f.ad||u?.displayName||"")}"><label>E-posta *</label><input id="o2" type="email" value="${esc(u?.email||"")}">

<label class="chk"><input type="checkbox" id="o8"><span><a href="#/sayfa/kvkk" target="_blank"><u>KVKK metnini</u></a> okudum.</span></label><div id="oE"></div></form>
<div class="box"><h3>Sipariş özeti</h3><table>${cart.map(c=>{const p=prod(c.id);return p?`<tr><td>${c.q} × ${esc(p.ad)}</td><td>${TL(p.fiyat*c.q)}</td></tr>`:""}).join("")}</table>
<p style="margin-top:10px">Kargo: ${t.k?TL(t.k):"Ücretsiz"}</p><h3>Havale ile: ${TL(t.top)}</h3><p>Kart ile: ${TL(t.sub+t.k)}</p>

return f+`<div class="box" style="overflow-x:auto"><table>${P.map(p=>`<tr><td>${p.img?`<img src="${esc(p.img)}" width="46" height="46" style="object-fit:cover">`:"📦"}</td><td><b>${esc(p.ad)}</b><br><small>${esc(catName(p.cat))}</small></td><td>${TL(p.fiyat)}</td><td>${p.stok}</td><td><button class="btn s" data-pe="${p.id}">Düzenle</button> <button class="btn s" data-pd="${p.id}">Sil</button></td></tr>`).join("")}</table></div>`};
A.orders=async()=>{const s=await getDocs(collection(db,"orders")),l=s.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)),ST=["Havale/EFT Bekleniyor","WhatsApp Onayı Bekleniyor","Ödeme Bekleniyor","Hazırlanıyor","Kargoda","Teslim Edildi","İptal"];
return`<h3>${l.length} sipariş</h3>`+l.map(o=>`<details class="box" style="margin-bottom:8px"><summary style="cursor:pointer"><b>${esc(o.code)}</b> · ${esc(o.musteri?.ad||"")} · ${TL(o.total)} · <span class="badge">${esc(o.status)}</span> <span class="badge">${esc(o.odeme)}</span></summary>
<p style="margin-top:10px">📞 ${esc(o.musteri?.tel||"")} · ✉️ ${esc(o.musteri?.email||"")}<br>📍 ${esc(o.musteri?.il||"")} ${esc(o.musteri?.adres||"")}${o.not?`<br>📝 ${esc(o.not)}`:""}</p><p>${(o.items||[]).map(x=>x.q+" × "+esc(x.ad)).join("<br>")}</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><select id="st-${o.code}" style="width:auto">${ST.map(x=>`<option ${x===o.status?"selected":""}>${x}</option>`).join("")}</select><input id="tn-${o.code}" placeholder="Kargo takip no" value="${esc(o.trackingNo||"")}" style="width:200px"><button class="btn p s" data-sv="${o.code}">Kaydet</button></div></details>`).join("")};

<div><label>Banka</label><input id="cf5" value="${esc(C("banka"))}"><label>Hesap sahibi</label><input id="cf6" value="${esc(C("hesapSahibi"))}"><label>IBAN</label><input id="cf7" value="${esc(C("iban"))}"><label>Shopier mağaza URL</label><input id="cf8" value="${esc(C("shopierUrl"))}"><label>WhatsApp sipariş numarası (örn. 905551234567)</label><input id="cf9" value="${esc(C("whatsapp")||"")}" placeholder="905XXXXXXXXX"></div></div><br><button class="btn p" id="cfS">Kaydet</button></div>`;

let timer,lastI=0;
function slideTo(i){const s=$$("#car .sl");if(!s.length)return;lastI=(i+s.length)%s.length;s.forEach((e,k)=>e.classList.toggle("on",k===lastI));$$("#car .dots button").forEach((e,k)=>e.classList.toggle("on",k===lastI))}
function startCar(){clearInterval(timer);lastI=0;if(SLIDES.length>1&&$("#car"))timer=setInterval(()=>slideTo(lastI+1),3000)}
async function route(){
if(!user){app.innerHTML=`<div class="lg"><form id="fAd" class="lgc"><div class="brand" style="justify-content:center"><b>H</b>Hevesmatik</div><p style="text-align:center;color:var(--soft);margin-bottom:6px">Yönetim paneli girişi</p><label>E-posta</label><input id="ad1" type="email" autocomplete="username"><label>Şifre</label><input id="ad2" type="password" autocomplete="current-password"><div id="adE"></div><br><button class="btn p" style="width:100%;justify-content:center;padding:13px">Giriş yap</button></form></div>`;return}
if(!isAdmin()){app.innerHTML=`<div class="w">${empty("Yetkiniz yok","Bu hesap yönetici değil.")}<p style="text-align:center"><button class="btn" data-out>Çıkış yap</button></p></div>`;return}
app.innerHTML=await V.admin();AT==="dash"?startDash():clearInterval(window._dt)}
addEventListener("hashchange",route);

async function loadAll(){try{const[p,c,s,cf]=await Promise.all([getDocs(collection(db,"products")).catch(()=>null),getDocs(collection(db,"categories")).catch(()=>null),getDocs(collection(db,"slides")).catch(()=>null),getDoc(doc(db,"config","main")).catch(()=>null)]);
if(p)P=p.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));
CATS=c&&c.size?c.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.sira||0)-(b.sira||0)):(P.length?[]:DEF.map(x=>({id:x[0],ad:x[1],ikon:x[2]})));
if(s)SLIDES=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.sira||0)-(b.sira||0));
if(cf&&cf.exists())CONF=cf.data();
$("#ftN").textContent=C("firma");$("#ftIg").href=C("instagram");$("#logo").innerHTML=CONF.logo?`<img src="${esc(CONF.logo)}" alt="">`:esc(C("firma"))}catch(e){console.error(e)}}
async function loadProf(){prof={};if(user)try{const s=await getDoc(doc(db,"users",user.uid));if(s.exists())prof=s.data()}catch{}}

const hata=c=>({"auth/email-already-in-use":"Bu e-posta ile zaten hesap var.","auth/invalid-email":"E-posta geçersiz.","auth/weak-password":"Şifre en az 6 karakter olmalı.","auth/invalid-credential":"E-posta veya şifre hatalı.","auth/too-many-requests":"Çok fazla deneme, biraz bekleyin."}[c]||"İşlem yapılamadı.");
function openAuth(){let mode="in";const o=document.createElement("div");o.className="ov";
o.innerHTML=`<div class="md"><div class="tabs"><button data-m="in" class="on">Giriş</button><button data-m="up">Kayıt ol</button></div><form id="fA"><div id="nm" hidden><label>Ad Soyad</label><input id="a0"></div><label>E-posta</label><input id="a1" type="email"><label>Şifre</label><input id="a2" type="password"><div id="aE"></div><br><button class="btn p" style="width:100%" id="aB">Giriş yap</button></form><p style="margin-top:12px;text-align:center;font-size:13px"><a href="#" id="fg"><u>Şifremi unuttum</u></a></p></div>`;
document.body.appendChild(o);const E=m=>o.querySelector("#aE").innerHTML=m?note(m,1):"";
o.onclick=e=>{if(e.target===o)o.remove();const m=e.target.dataset?.m;if(m){mode=m;o.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.m===m));o.querySelector("#nm").hidden=m!=="up";o.querySelector("#aB").textContent=m==="in"?"Giriş yap":"Hesap oluştur";E("")}};
o.querySelector("#fg").onclick=async e=>{e.preventDefault();const m=o.querySelector("#a1").value.trim();if(!m)return E("Önce e-posta yazın.");try{await sendPasswordResetEmail(auth,m);o.querySelector("#aE").innerHTML=note("Sıfırlama bağlantısı gönderildi.")}catch(x){E(hata(x.code))}};
o.querySelector("#fA").onsubmit=async e=>{e.preventDefault();const m=o.querySelector("#a1").value.trim(),p=o.querySelector("#a2").value;if(!m||!p)return E("E-posta ve şifre gerekli.");
try{if(mode==="in")await signInWithEmailAndPassword(auth,m,p);else{const c=await createUserWithEmailAndPassword(auth,m,p),n=o.querySelector("#a0").value.trim();if(n)await updateProfile(c.user,{displayName:n});await setDoc(doc(db,"users",c.user.uid),{ad:n,email:m,createdAt:serverTimestamp()},{merge:true})}
o.remove();PT="bilgi";location.hash="#/profil"}catch(x){E(hata(x.code))}}}
$("#bU").onclick=()=>{if(user)location.hash="#/profil";else openAuth()};
$("#fS").onsubmit=e=>{e.preventDefault();const q=$("#q").value.trim();if(q)location.hash="#/ara/"+encodeURIComponent(q)};

document.addEventListener("click",async e=>{const t=e.target.closest("[data-add],[data-q],[data-rm],[data-cp],[data-go],[data-dot],[data-pt],[data-out],[data-at],[data-sv],[data-pe],[data-pd],[data-pn],[data-pc],[data-cd],[data-ce],[data-sld],[data-sup],[data-seed]");
if(e.target.closest("#payS"))return handlePay("shopier");if(e.target.closest("#payH"))return handlePay("havale");
if(e.target.id==="cfS")return saveSettings();if(!t)return;const d=t.dataset;
try{
if(d.add){const p=prod(d.add);if(!p||p.stok<1)return;const c=cart.find(x=>x.id===d.add);if(c){if(c.q<p.stok)c.q++}else cart.push({id:d.add,q:1});saveCart();const o=t.textContent;t.textContent="✓ Eklendi";setTimeout(()=>t.textContent=o,1000);return}
if(d.q){const c=cart.find(x=>x.id===d.q);if(c){c.q=Math.max(1,Math.min(prod(c.id)?.stok||99,c.q+ +d.d));saveCart();route()}return}
if(d.rm){cart=cart.filter(x=>x.id!==d.rm);saveCart();route();return}
if(d.cp!==undefined){navigator.clipboard?.writeText(d.cp);t.textContent="✓";return}
if(d.go){slideTo(lastI+ +d.go);startCar2();return}if(d.dot!==undefined){slideTo(+d.dot);startCar2();return}
if(d.pt){PT=d.pt;route();return}
if(d.out!==undefined){if(confirm("Çıkış yapmak istiyor musunuz?")){await signOut(auth);location.hash="#/"}return}
if(d.at){AT=d.at;ED=null;route();return}
if(d.pn!==undefined){ED={};route();return}if(d.pc!==undefined){ED=null;route();return}if(d.pe){ED={...prod(d.pe)};route();return}
if(d.pd&&confirm("Ürün silinsin mi?")){await deleteDoc(doc(db,"products",d.pd));await loadAll();route();return}
if(d.cd&&confirm("Kategori silinsin mi?")){await deleteDoc(doc(db,"categories",d.cd));await loadAll();route();return}
if(d.ce){const n=prompt("Yeni ad:",catName(d.ce));if(n){await updateDoc(doc(db,"categories",d.ce),{ad:n});await loadAll();route()}return}
if(d.sld&&confirm("Slayt silinsin mi?")){await deleteDoc(doc(db,"slides",d.sld));await loadAll();route();return}
if(d.sup){await updateDoc(doc(db,"slides",d.sup),{sira:Math.min(0,...SLIDES.map(s=>s.sira||0))-1});await loadAll();route();return}
if(d.seed!==undefined){for(const[i,c]of DEF.entries())await setDoc(doc(db,"categories",c[0]),{ad:c[1],ikon:c[2],sira:i});await loadAll();route();return}
if(d.sv){{const st=$("#st-"+d.sv).value,tn=$("#tn-"+d.sv).value.trim();await updateDoc(doc(db,"orders",d.sv),{status:st,trackingNo:tn});const od=await getDoc(doc(db,"orders",d.sv)),tc=od.data()?.trackCode;if(tc)await setDoc(doc(db,"tracking",tc),{status:st,trackingNo:tn},{merge:true})}alert("Kaydedildi")}
}catch(x){alert("İşlem başarısız: "+(x.code||x.message))}});
function startCar2(){startCar()}

async function saveSettings(){const v=i=>$("#cf"+i).value.trim();try{const r={firma:v(1),tel:v(2),email:v(3),instagram:v(4),banka:v(5),hesapSahibi:v(6),iban:v(7),shopierUrl:v(8),whatsapp:v(9)},f=$("#lg").files[0];if(f)r.logo=await img2url(f,500,120);
await setDoc(doc(db,"config","main"),r,{merge:true});await loadAll();alert("Kaydedildi");route()}catch(x){alert(errTxt(x))}}

document.addEventListener("submit",async e=>{e.preventDefault();const t=e.target,id=t.id;
if(id==="fT"){const c=$("#tc").value.trim().toUpperCase();if(c)location.hash="#/takip/"+encodeURIComponent(c)}
if(id==="fPr"){const g=i=>$("#f"+i).value.trim();try{prof={...prof,ad:g(1),tel:g(2),cinsiyet:$("#f3").value,dogum:g(4),il:g(5),adres:g(6),email:user.email};await setDoc(doc(db,"users",user.uid),prof,{merge:true});if(prof.ad&&prof.ad!==user.displayName)await updateProfile(user,{displayName:prof.ad});$("#fE").innerHTML=note("✅ Bilgileriniz kaydedildi.")}catch(x){$("#fE").innerHTML=note("Kaydedilemedi: "+esc(x.code||x.message),1)}}
if(id==="fC"){try{let img=$("#kc4").value.trim();const f=$("#kc3").files[0];if(f)img=await img2url(f,600,150);const n=$("#kc1").value.trim();await setDoc(doc(db,"categories",slug(n)||String(Date.now())),{ad:n,ikon:$("#kc2").value.trim()||"📦",img:img||null,sira:Date.now()});await loadAll();route()}catch(x){alert(errTxt(x))}}
if(id==="fP"){const g=i=>$("#p"+i).value.trim(),E=m=>$("#pE").innerHTML=note(m,1);const bt=t.querySelector(".btn.p");if(bt){bt.disabled=true;bt.textContent="Kaydediliyor…"}try{let img=ED.img||"";const f=$("#p8").files[0];if(f)img=await img2url(f,1000,420);else if(g(9))img=g(9);
const r={ad:g(1),cat:$("#p2").value,fiyat:+g(3),eski:+g(4)||0,rozet:g(5),stok:+g(6),aciklama:g(7),img,ts:ED.ts||Date.now()};
if(!r.ad)throw new Error("Ürün adı gerekli.");if(!(r.fiyat>=0))throw new Error("Geçerli bir fiyat girin.");if(ED.id)await setDoc(doc(db,"products",ED.id),r);else await setDoc(doc(collection(db,"products")),r);ED=null;await loadAll();route()}catch(x){E("Kaydedilemedi: "+esc(errTxt(x)));const b=t.querySelector(".btn.p");if(b){b.disabled=false;b.textContent=id==="fP"?"Kaydet":"Slayt ekle"}}}
if(id==="fSl"){const g=i=>$("#sl"+i).value.trim(),E=m=>$("#slE").innerHTML=note(m,1);const bt=t.querySelector(".btn.p");if(bt){bt.disabled=true;bt.textContent="Yükleniyor…"}try{let img=g(6);const f=$("#sl5").files[0];if(f)img=await img2url(f,1920,700);if(!img)return E("Görsel gerekli.");
await setDoc(doc(collection(db,"slides")),{baslik:g(1),alt:g(2),cta:g(3),link:g(4),img,sira:Date.now()});await loadAll();route()}catch(x){E("Kaydedilemedi: "+esc(errTxt(x)));const b=t.querySelector(".btn.p");if(b){b.disabled=false;b.textContent=id==="fP"?"Kaydet":"Slayt ekle"}}}});

const genCode=()=>"HVS-"+[...crypto.getRandomValues(new Uint8Array(10))].map(x=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[x%31]).join("");
async function handlePay(m){const g=i=>$("#o"+i).value.trim(),E=s=>$("#oE").innerHTML=note(s,1);
if(!g(1)||!g(3)||!g(4)||!g(5))return E("Ad, telefon, il/ilçe ve adres zorunludur.");if(!/^\S+@\S+\.\S+$/.test(g(2)))return E("Geçerli e-posta girin.");if(g(3).replace(/\D/g,"").length<10)return E("Geçerli telefon girin.");
if(!$("#o7").checked||!$("#o8").checked)return E("Sözleşme ve KVKK onaylarını işaretleyin.");const t=totals(),code=genCode();
try{await setDoc(doc(db,"orders",code),{code,userId:user?user.uid:null,items:cart.map(x=>({id:x.id,ad:prod(x.id).ad,fiyat:prod(x.id).fiyat,q:x.q})),ara:t.sub,indirim:m==="havale"?t.ind:0,kargo:t.k,total:m==="havale"?t.top:t.sub+t.k,odeme:m,status:"Ödeme Bekleniyor",trackingNo:"",not:g(6),musteri:{ad:g(1),email:g(2),tel:g(3),il:g(4),adres:g(5)},onay:true,createdAt:serverTimestamp()});
if(user&&!prof.adres)setDoc(doc(db,"users",user.uid),{ad:prof.ad||g(1),tel:g(3),il:g(4),adres:g(5)},{merge:true}).catch(()=>{});
cart=[];saveCart();if(m==="shopier")window.open(C("shopierUrl"),"_blank");location.hash="#/siparis/"+code}catch(x){console.error(x);E("Sipariş kaydedilemedi, tekrar deneyin.")}}

document.addEventListener("submit",async e=>{if(e.target.id!=="fAd")return;try{await signInWithEmailAndPassword(auth,$("#ad1").value.trim(),$("#ad2").value)}catch(x){$("#adE").innerHTML=note(hata(x.code),1)}});
onAuthStateChanged(auth,async u=>{user=u;await loadProf();if(!window._l){window._l=1;await loadAll()}route()});
if(!LSg("hvs_ck",false))$("#ck").hidden=false;$("#ckOk").onclick=()=>{LSs("hvs_ck",true);$("#ck").hidden=true};
saveCart();
</script></body></html>
