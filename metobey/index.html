.dg{display:grid;grid-template-columns:1fr 1fr;gap:16px}

const img2url=f=>new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>{
    const i=new Image();
    i.onload=()=>{
      const maxW=600,maxH=600;let w=i.width,h=i.height;
      if(w>maxW||h>maxH){const ratio=Math.min(maxW/w,maxH/h);w=Math.round(w*ratio);h=Math.round(h*ratio)}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(i,0,0,w,h);
      res(c.toDataURL("image/jpeg",0.7));
    };

  };

const pad2=n=>String(n).padStart(2,"0");const DAY=864e5,HR=36e5,num=n=>new Intl.NumberFormat("tr-TR").format(n||0);

const COL=["#A5D3E8","#4A87A8","#7DD3FC","#3DFFA2","#FFD27D"];
const chart=(d,{c="#A5D3E8",bar=0,money=0,id})=>{const w=800,h=210,L=46,B=26,T=12,max=Math.max(1,...d.map(x=>x.v)),n=d.length,bw=(w-L-8)/n,y=v=>h-B-(v/max)*(h-T-B),f=v=>money?"₺"+num(Math.round(v)):num(Math.round(v));
const g=[0,.5,1].map(q=>`<line x1="${L}" x2="${w-8}" y1="${y(max*q)}" y2="${y(max*q)}" stroke="rgba(165,211,232,.12)"/><text x="${L-6}" y="${y(max*q)+3}" text-anchor="end" font-size="10" fill="#7f9bb0">${f(max*q)}</text>`).join("");

const donut=it=>{const t=it.reduce((a,b)=>a+b[1],0)||1,R=42,Cc=2*Math.PI*R;let o=0;return`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 120 120" width="130" style="filter:drop-shadow(0 0 8px rgba(165,211,232,.55))"><g transform="rotate(-90 60 60)">${it.map((x,i)=>{const l=x[1]/t*Cc,r=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${COL[i%5]}" stroke-width="14" stroke-dasharray="${l} ${Cc-l}" stroke-dashoffset="${-o}"/>`;o+=l;return r}).join("")}</g></svg><div>${it.map((x,i)=>`<div style="font-size:13px"><i style="display:inline-block;width:10px;height:10px;background:${COL[i%5]};margin-right:8px"></i>${esc(x[0])} <b>${Math.round(x[1]/t*100)}%</b></div>`).join("")||"<small>Veri yok</small>"}</div></div>`};

/* ============ EVENTLER ============ */
document.addEventListener("click",async e=>{
  if(e.target.closest("[data-out]")){if(confirm("Çıkış yapılsın mı?")){await signOut(auth);location.reload()}return}
  if(e.target.id==="cfS")return saveSettings();
  const t=e.target.closest("[data-at],[data-sv],[data-pe],[data-pd],[data-pn],[data-pc],[data-cd],[data-ce],[data-sld],[data-sup],[data-seed]");if(!t)return;const d=t.dataset;
  try{
    if(d.at){AT=d.at;ED=null;renderAdmin();return}
    if(d.pn!==undefined){ED={};renderAdmin();return}
    if(d.pc!==undefined){ED=null;renderAdmin();return}
    if(d.pe){ED={...P.find(x=>x.id===d.pe)};renderAdmin();return}
    if(d.pd&&confirm("Ürün silinsin mi?")){await deleteDoc(doc(db,"products",d.pd));await loadAll();renderAdmin();return}
    if(d.cd&&confirm("Kategori silinsin mi?")){await deleteDoc(doc(db,"categories",d.cd));await loadAll();renderAdmin();return}
    if(d.ce){const n=prompt("Yeni ad:",catName(d.ce));if(n){await updateDoc(doc(db,"categories",d.ce),{ad:n});await loadAll();renderAdmin()}return}
    if(d.sld&&confirm("Slayt silinsin mi?")){await deleteDoc(doc(db,"slides",d.sld));await loadAll();renderAdmin();return}
    if(d.sup){await updateDoc(doc(db,"slides",d.sup),{sira:Math.min(0,...SLIDES.map(s=>s.sira||0))-1});await loadAll();renderAdmin();return}
    if(d.seed!==undefined){for(const[i,c]of DEF.entries())await setDoc(doc(db,"categories",c[0]),{ad:c[1],ikon:c[2],sira:i});await loadAll();renderAdmin();return}
    if(d.sv){await updateDoc(doc(db,"orders",d.sv),{status:$("#st-"+d.sv).value,trackingNo:$("#tn-"+d.sv).value.trim()});alert("Kaydedildi");return}
  }catch(x){alert("İşlem başarısız: "+(x.code||x.message))}
});

document.addEventListener("submit",async e=>{const t=e.target,id=t.id;if(!id)return;e.preventDefault();
  if(id==="fLog"){try{await signInWithEmailAndPassword(auth,$("#l1").value.trim(),$("#l2").value)}catch(x){const hata={"auth/invalid-credential":"E-posta veya şifre hatalı.","auth/too-many-requests":"Çok fazla deneme, bekleyin.","auth/invalid-email":"E-posta geçersiz."}[x.code]||"Giriş yapılamadı.";$("#lE").innerHTML=note(hata,1)}}
  if(id==="fC"){try{let img=$("#kc4").value.trim();const f=$("#kc3").files[0];if(f)img=await img2url(f);const n=$("#kc1").value.trim();await setDoc(doc(db,"categories",slug(n)||String(Date.now())),{ad:n,ikon:$("#kc2").value.trim()||"📦",img:img||null,sira:Date.now()});await loadAll();renderAdmin()}catch(x){alert(x.code||x.message)}}
  if(id==="fP"){const g=i=>$("#p"+i).value.trim(),E=m=>$("#pE").innerHTML=note(m,1);try{let img=ED.img||"";const f=$("#p8").files[0];if(f)img=await img2url(f);else if(g(9))img=g(9);
    const r={ad:g(1),cat:$("#p2").value,fiyat:+g(3),eski:+g(4)||0,rozet:g(5),stok:+g(6),aciklama:g(7),img,ts:ED.ts||Date.now()};

    await setDoc(doc(collection(db,"slides")),{baslik:g(1),alt:g(2),cta:g(3),link:g(4),img,sira:Date.now()});await loadAll();renderAdmin()}catch(x){E("Kaydedilemedi: "+(x.code||x.message))}}
});

async function saveSettings(){const v=i=>$("#cf"+i).value.trim();try{const r={firma:v(1),tel:v(2),email:v(3),instagram:v(4),banka:v(5),hesapSahibi:v(6),iban:v(7),shopierUrl:v(8)},f=$("#lg").files[0];if(f)r.logo=await img2url(f);
await setDoc(doc(db,"config","main"),r,{merge:true});await loadAll();alert("Kaydedildi");renderAdmin()}catch(x){alert(x.code||x.message)}}

async function loadAll(){try{const[p,c,s,cf]=await Promise.all([getDocs(collection(db,"products")).catch(()=>null),getDocs(collection(db,"categories")).catch(()=>null),getDocs(collection(db,"slides")).catch(()=>null),getDoc(doc(db,"config","main")).catch(()=>null)]);
if(p&&p.size)P=p.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));else P=[];
if(c&&c.size)CATS=c.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.sira||0)-(b.sira||0));else CATS=DEF.map(x=>({id:x[0],ad:x[1],ikon:x[2]}));
if(s&&s.size)SLIDES=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.sira||0)-(b.sira||0));else SLIDES=[];
if(cf&&cf.exists())CONF=cf.data()}catch(e){console.error(e)}}

onAuthStateChanged(auth,async u=>{
  user=u;
  if(!u){renderLogin();return}
  if(!isAdmin()){renderNotAdmin();return}
  if(!window._l){window._l=1;await loadAll()}
  renderAdmin();
});
